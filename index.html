<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Starlite</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#e3e6eb;--ac:#1b6fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1a2029;--tx:#e8ecf1;--mu:#98a3b3;--bd:#2a3340;--ac:#5aa2f0}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1a2029;--tx:#e8ecf1;--mu:#98a3b3;--bd:#2a3340;--ac:#5aa2f0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd)}
.in{max-width:1000px;margin:0 auto;padding:0 18px}
.hd{display:flex;align-items:center;gap:16px;padding:16px 0}
.lg{flex:none;background:#fff;border-radius:10px;padding:4px 8px;line-height:0}
.lg img{height:58px;width:auto}
h1{margin:0;font-size:21px;font-weight:650}
.sub{color:var(--mu);font-size:13.5px;margin-top:2px}
#th{margin-left:auto;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.bar{display:flex;gap:12px;align-items:center;margin:20px 0 6px}
#q{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;outline:none}
#q:focus{border-color:var(--ac)}
#n{color:var(--mu);font-size:13px;white-space:nowrap}
h2 span{font-weight:400;opacity:.7;margin-left:4px}
h2{margin:26px 0 10px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
a.c{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:11px 12px;text-decoration:none;color:var(--tx)}
a.c:hover{border-color:var(--ac)}
.m{flex:none;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.b{min-width:0}.t{font-weight:560;font-size:14.5px;word-break:break-word}
.d{color:var(--mu);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#e{display:none;color:var(--mu);padding:30px 0}
footer{color:var(--mu);font-size:12.5px;margin:34px 0 22px}
[hidden]{display:none!important}
.act{margin-left:auto;display:flex;gap:8px}.act #th{margin-left:0}
button.pri{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.w{position:relative}
button.c{width:100%;font:inherit;text-align:left;cursor:pointer;border-style:dashed}
button.c:disabled{cursor:default;opacity:.8}
.ed{position:absolute;top:50%;right:8px;transform:translateY(-50%);border:0;background:transparent;color:var(--mu);cursor:pointer;font-size:15px;padding:6px;border-radius:6px}
.ed:hover{background:var(--bg);color:var(--ac)}
.w .ew{padding-right:38px}
.d.nl{color:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 14px;font-size:17px}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
dialog input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:none}
dialog input:focus{border-color:var(--ac)}dialog input[readonly]{opacity:.7}
#ty{font-size:12.5px;color:var(--mu);margin-top:8px;min-height:18px}
#er{font-size:13px;color:#c0392b;margin-top:8px;min-height:18px}
.bt{display:flex;gap:8px;margin-top:14px}.bt .sp{flex:1}
.bt button{border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.bt button.pri{border:0;background:var(--ac);color:#fff}
.bt button.dn{color:#c0392b}
button.c{background:var(--card);color:var(--tx);border:1px dashed var(--bd)}
button.c:disabled{color:var(--tx)}
#cp{margin-left:10px;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
@media (max-width:640px){
.in{padding:0 14px}
.hd{gap:12px;padding:12px 0}
.lg img{height:44px}
h1{font-size:18px}
.sub{font-size:12.5px}
.act #add{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;padding:13px 20px;border-radius:999px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
footer{margin-bottom:84px}
.g{grid-template-columns:1fr}
.ed{padding:10px;right:4px}
dialog{max-height:90vh;overflow:auto}
dialog input,#q{font-size:16px}
}
dialog textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none;resize:vertical}
dialog textarea:focus{border-color:var(--ac)}
.ds{color:var(--mu);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:640px){dialog textarea{font-size:16px}}
dialog select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:none}
dialog select:focus{border-color:var(--ac)}
.w .c{border-left:4px solid var(--cc,var(--bd))}
.cb{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent)}
#lg{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:12.5px;color:var(--mu)}
#lg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc);margin-right:5px}
@media (max-width:640px){dialog select{font-size:16px}}
.md{display:flex;gap:6px;margin:8px 0 0}
.md button{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.md button.on{background:var(--ac);border-color:var(--ac);color:#fff}
h2.cg{color:var(--cc)}
h2.cg:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc);margin-right:8px}
.bt{position:sticky;bottom:-20px;background:var(--card);padding-top:12px}
</style>
</head>

function parseCsv(t){var r=[],row=[],c="",q=false,i,ch;for(i=0;i<t.length;i++){ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch=='"')q=true;else if(ch==','){row.push(c);c=""}
else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=""}else c+=ch}
if(c||row.length){row.push(c);r.push(row)}return r}
function parseSheet(t){var o=[];parseCsv(t).forEach(function(row){var c=row.map(function(x){return x.trim()}),ui=-1,i;

o.push({t:title,u:c[ui]})});return o}

h+='</div>'});
